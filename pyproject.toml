[project]
name = "crm-starter"
version = "0.1.0"
description = "Provider-driven CRM starter: FastAPI + Jinja + HTMX. Declarative resources over pluggable backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tony Benoy", email = "me@tonybenoy.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "authlib>=1.3",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "typer>=0.15",
    "asyncpg>=0.31.0",
    "aioboto3>=15.5.0",
]

[project.scripts]
crm = "app.cli:app"

[project.entry-points."crm.modules"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx2>=2.12.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
