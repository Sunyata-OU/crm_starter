# Alembic configuration.
#
# The database URL is deliberately absent: it comes from the same
# connections.yaml the application reads, so there is one place to change it.
# See migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# A timestamp prefix makes the ordering obvious in a directory listing, which
# matters when several people add migrations in the same week.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
